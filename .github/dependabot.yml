version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Berlin"
    versioning-strategy: "increase"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      phpstan:
        patterns:
          - "phpstan/*"
      phpunit:
        patterns:
          - "phpunit/*"
      infection:
        patterns:
          - "infection/*"
      symfony:
        patterns:
          - "symfony/*"
      quality-tools:
        patterns:
          - "vimeo/psalm"
          - "rector/rector"
          - "deptrac/deptrac"
          - "squizlabs/php_codesniffer"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
