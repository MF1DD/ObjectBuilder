
imports:
  - ./deptrac.baseline.yaml

parameters:
  strict: true
  paths:
    - ./../../src/

  exclude_files:
    - '#.*test.*#'

  layers:
    - name: Domain
      collectors:
        - type: classLike
          value: ^MF1DD\\Domain\\

    - name: Application
      collectors:
        - type: classLike
          value: ^MF1DD\\Application\\

    - name: Infrastructure
      collectors:
        - type: classLike
          value: ^MF1DD\\Infrastructure\\

    - name: UserInterface
      collectors:
        - type: classLike
          value: ^MF1DD\\UserInterface\\

  ruleset:
    Domain: []
    Application:
      - Domain
      - Infrastructure
    UserInterface:
      - Application
      - Domain
    Infrastructure:
      - Application
      - Domain
